<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Rounded developer badge -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Outer subtle border -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Left Code Bracket < -->
  <path d="M15 16 L7 24 L15 32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Center Slash / -->
  <path d="M21 34 L27 14" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Right Code Bracket > -->
  <path d="M33 16 L41 24 L33 32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>